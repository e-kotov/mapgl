name: Temporary FlowmapGL bundle regeneration
on:
  push:
    branches:
      - chore/flowmap-gl-9.5.0-vendor
permissions:
  contents: write
jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regen-flowmap-95]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Rebuild and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check inst/htmlwidgets/flowmap.js
          data-raw/flowmap-vendor/build-flowmap.sh build
          data-raw/flowmap-vendor/build-flowmap.sh check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-bundle.min.js \
            inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-vendor-manifest.json \
            LICENSE.note
          git diff --cached --check -- . ':!inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-bundle.min.js'
          if ! git diff --cached --quiet; then
            git commit -m 'build(flowmap): rebuild 9.5 browser bundle with canvas helper exports'
            git push origin HEAD:chore/flowmap-gl-9.5.0-vendor
          fi
# Rebuild trigger
