name: Temporary FlowmapGL luma dependency alignment
on:
  push:
    branches: [chore/flowmap-gl-9.5.0-vendor]
permissions:
  contents: write
jobs:
  regenerate:
    if: contains(github.event.head_commit.message, '[regenerate-luma-942]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Regenerate lockfile and verify that luma.gl is not duplicated
        working-directory: data-raw/flowmap-vendor
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkgs=JSON.parse(fs.readFileSync('package-lock.json')).packages;
          const all=Object.entries(pkgs).filter(([path])=>path.includes('node_modules/@luma.gl/'));
          for (const [path,value] of all) {
            if (value.version !== '9.4.2') throw new Error(path + ': ' + value.version + ' (expected 9.4.2)');
            const parts=path.split('node_modules/');
            if (parts.length > 2) throw new Error('Duplicate nested luma.gl: ' + path);
          }
          if (!all.length) throw new Error('No luma.gl dependencies found');
          console.log('Single luma.gl family: '+all.length+' packages at 9.4.2');
          JS
      - name: Build reproducible patched FlowmapGL vendor bundle
        shell: bash
        run: |
          set -euo pipefail
          data-raw/flowmap-vendor/build-flowmap.sh build
          data-raw/flowmap-vendor/build-flowmap.sh check
      - name: Commit generated artifacts only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-raw/flowmap-vendor/package-lock.json \
            inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-bundle.min.js \
            inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-vendor-manifest.json \
            LICENSE.note
          git diff --cached --check -- . ':!inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-bundle.min.js'
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate vendor with one luma.gl 9.4.2 dependency tree'
            git push origin HEAD:chore/flowmap-gl-9.5.0-vendor
          fi
