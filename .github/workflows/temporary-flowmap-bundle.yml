name: Temporary rebuild for experimental FlowmapGL 9.5 features
on:
  push:
    branches:
      - chore/flowmap-gl-9.5.0-vendor
permissions:
  contents: write
jobs:
  bundle:
    if: contains(github.event.head_commit.message, '[regen-flowmap-bundle]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Build checked-in FlowmapGL bundle and verify reproducibility
        shell: bash
        run: |
          set -euo pipefail
          data-raw/flowmap-vendor/build-flowmap.sh build
          data-raw/flowmap-vendor/build-flowmap.sh check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-bundle.min.js \
            inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-vendor-manifest.json \
            LICENSE.note
          git diff --cached --check -- . ':!inst/htmlwidgets/lib/flowmap-gl/flowmap-gl-bundle.min.js'
          if ! git diff --cached --quiet; then
            git commit -m 'build: bundle FlowmapGL legend and experimental globe exports'
            git push origin HEAD:chore/flowmap-gl-9.5.0-vendor
          fi
# one-time trigger
